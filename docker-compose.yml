services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    profiles: [mongodb]
    networks: [private]
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8787
      CLIENT_ORIGIN: http://localhost:4180
      MONGODB_ENABLED: "false"
      LIBREOFFICE_ENABLED: "true"
      JOB_TIMEOUT_MS: 60000
    read_only: true
    tmpfs: ["/tmp:size=384m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1
    pids_limit: 96
    networks: [private]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports: ["4180:80"]
    depends_on:
      api:
        condition: service_healthy
    networks: [front, private]
networks:
  front: {}
  private:
    internal: true
volumes:
  mongo-data: {}
