server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 26m;
  # IMG.LY uses generated ndarray functions, WASM, and a blob runtime loader.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' blob: data:; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self' blob:; connect-src 'self' blob: https://staticimgly.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location ~ \.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
  }
  location /api/ {
    proxy_pass ${API_BASE_URL}/;
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
    proxy_read_timeout 90s;
    proxy_request_buffering off;
  }
  location / { try_files $uri $uri/ /index.html; }
}
