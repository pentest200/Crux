server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 26m;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location ~ \.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
  }
  location /api/ {
    proxy_pass http://${API_HOSTPORT}/;
    proxy_read_timeout 90s;
    proxy_request_buffering off;
  }
  location / { try_files $uri $uri/ /index.html; }
}
